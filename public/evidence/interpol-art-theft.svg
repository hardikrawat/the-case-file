<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="600" height="300" fill="#0f172a"/>
  
  <!-- Subtle Grid -->
  <pattern id="secGrid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="1"/>
  </pattern>
  <rect width="600" height="300" fill="url(#secGrid)"/>

  <!-- Red Alert Banner -->
  <rect x="0" y="0" width="600" height="42" fill="#991b1b"/>
  <text x="30" y="27" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#ffffff" letter-spacing="3">
    🔴 INTERPOL • STOLEN WORKS OF ART DATABASE (PSYCHE)
  </text>

  <!-- Left Side: Shield Emblem -->
  <circle cx="95" cy="165" r="55" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <!-- Globe lines -->
  <ellipse cx="95" cy="165" rx="45" ry="45" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="95" cy="165" rx="20" ry="45" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
  <line x1="50" y1="165" x2="140" y2="165" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
  <!-- Scales / Sword Icon -->
  <polygon points="95,125 102,145 95,205 88,145" fill="#f8fafc"/>
  <line x1="75" y1="145" x2="115" y2="145" stroke="#f8fafc" stroke-width="3"/>

  <!-- Right Side: Stolen Art Notice File -->
  <text x="180" y="90" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#38bdf8" letter-spacing="1">
    RECORD ID: #49210-ART-EU
  </text>
  <text x="180" y="118" font-family="'Georgia', serif" font-size="18" font-weight="bold" fill="#f8fafc">
    The Florentine Shadow (c. 1512)
  </text>
  <text x="180" y="142" font-family="sans-serif" font-size="12" fill="#94a3b8">
    Attributed: Matteo da Milano • Oil on Poplar Panel
  </text>
  <text x="180" y="162" font-family="sans-serif" font-size="12" fill="#94a3b8">
    Stolen From: Blackwood Private Gallery, London
  </text>
  <text x="180" y="185" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#ef4444">
    STATUS: ACTIVE GLOBAL TRACE (RED NOTICE)
  </text>

  <!-- Barcode at bottom right -->
  <g transform="translate(180, 215)">
    <rect x="0" y="0" width="4" height="35" fill="#e2e8f0"/>
    <rect x="7" y="0" width="2" height="35" fill="#e2e8f0"/>
    <rect x="12" y="0" width="8" height="35" fill="#e2e8f0"/>
    <rect x="23" y="0" width="3" height="35" fill="#e2e8f0"/>
    <rect x="29" y="0" width="6" height="35" fill="#e2e8f0"/>
    <rect x="38" y="0" width="2" height="35" fill="#e2e8f0"/>
    <rect x="44" y="0" width="7" height="35" fill="#e2e8f0"/>
    <rect x="54" y="0" width="4" height="35" fill="#e2e8f0"/>
    <rect x="62" y="0" width="9" height="35" fill="#e2e8f0"/>
    <rect x="75" y="0" width="3" height="35" fill="#e2e8f0"/>
    <rect x="82" y="0" width="6" height="35" fill="#e2e8f0"/>
    <rect x="92" y="0" width="2" height="35" fill="#e2e8f0"/>
    <rect x="98" y="0" width="5" height="35" fill="#e2e8f0"/>
    <rect x="108" y="0" width="8" height="35" fill="#e2e8f0"/>
    <rect x="120" y="0" width="4" height="35" fill="#e2e8f0"/>
    <rect x="128" y="0" width="7" height="35" fill="#e2e8f0"/>
    <rect x="139" y="0" width="2" height="35" fill="#e2e8f0"/>
    <rect x="145" y="0" width="6" height="35" fill="#e2e8f0"/>
    <rect x="155" y="0" width="3" height="35" fill="#e2e8f0"/>
    <rect x="162" y="0" width="8" height="35" fill="#e2e8f0"/>
    <rect x="174" y="0" width="2" height="35" fill="#e2e8f0"/>
    <rect x="180" y="0" width="5" height="35" fill="#e2e8f0"/>
    <text x="0" y="50" font-family="'Courier New', monospace" font-size="10" fill="#64748b" letter-spacing="3">
      *49210-9941-FL-EU*
    </text>
  </g>
