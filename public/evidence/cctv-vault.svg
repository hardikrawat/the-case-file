<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="nightVision" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e3a2f"/>
      <stop offset="60%" stop-color="#061c16"/>
      <stop offset="100%" stop-color="#020806"/>
    </radialGradient>
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.5" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Night Vision Base -->
  <rect width="600" height="600" fill="url(#nightVision)"/>

  <!-- Hallway Perspective Lines -->
  <!-- Floor -->
  <polygon points="0,600 600,600 380,320 220,320" fill="#092820"/>
  <!-- Floor tiles -->
  <line x1="0" y1="600" x2="220" y2="320" stroke="#174f40" stroke-width="2"/>
  <line x1="600" y1="600" x2="380" y2="320" stroke="#174f40" stroke-width="2"/>
  <line x1="180" y1="600" x2="270" y2="320" stroke="#124034" stroke-width="1"/>
  <line x1="420" y1="600" x2="330" y2="320" stroke="#124034" stroke-width="1"/>
  
  <!-- Ceiling -->
  <polygon points="0,0 600,0 380,180 220,180" fill="#051712"/>
  
  <!-- Vault Door at End of Hall -->
  <rect x="235" y="180" width="130" height="140" fill="#0d382d" stroke="#227a65" stroke-width="3"/>
  <!-- Circular Vault Lock -->
  <circle cx="300" cy="250" r="38" fill="#07221b" stroke="#34d399" stroke-width="3"/>
  <circle cx="300" cy="250" r="16" fill="#134e3f" stroke="#34d399" stroke-width="2"/>
  <line x1="300" y1="212" x2="300" y2="288" stroke="#34d399" stroke-width="2"/>
  <line x1="262" y1="250" x2="338" y2="250" stroke="#34d399" stroke-width="2"/>

  <!-- Left Wall Keycard Terminal Glowing Red/Green -->
  <rect x="195" y="270" width="18" height="32" fill="#0b1b15" stroke="#34d399" stroke-width="1.5"/>
  <circle cx="204" cy="282" r="3" fill="#ef4444"/>
  <circle cx="204" cy="292" r="3" fill="#34d399"/>

  <!-- Shadowy Figure at Terminal (Suspect Vance) -->
  <!-- Torso & Security Jacket with Epaulets -->
  <path d="M 120,440 C 140,350 170,330 200,310 C 230,330 240,360 250,440 Z" fill="#030b08"/>
  <ellipse cx="185" cy="275" rx="22" ry="26" fill="#020806"/>
  <!-- Arm extended toward terminal -->
  <path d="M 195,330 Q 215,310 210,285" stroke="#030b08" stroke-width="16" stroke-linecap="round" fill="none"/>
  <!-- Gold trim reflection on uniform shoulder -->
  <path d="M 140,360 L 165,345" stroke="#fbbf24" stroke-width="3" opacity="0.8"/>

  <!-- Scanlines Overlay -->
  <rect width="600" height="600" fill="url(#scanlines)"/>

  <!-- CCTV UI HUD Overlay -->
  <!-- Target Reticle / Crosshair -->
  <circle cx="300" cy="300" r="40" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="6,4" opacity="0.6"/>
  <line x1="300" y1="240" x2="300" y2="270" stroke="#34d399" stroke-width="1.5" opacity="0.7"/>
  <line x1="300" y1="330" x2="300" y2="360" stroke="#34d399" stroke-width="1.5" opacity="0.7"/>
  <line x1="240" y1="300" x2="270" y2="300" stroke="#34d399" stroke-width="1.5" opacity="0.7"/>
  <line x1="330" y1="300" x2="360" y2="300" stroke="#34d399" stroke-width="1.5" opacity="0.7"/>

  <!-- Camera info HUD -->
  <text x="35" y="55" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#34d399" letter-spacing="1">
    CAM-04: EAST WING VAULT
  </text>
  <text x="35" y="82" font-family="'Courier New', monospace" font-size="14" fill="#a7f3d0" letter-spacing="1">
    FPS: 15.0 • GAIN: +18dB • NIGHT-VISION
  </text>

  <!-- Recording Indicator -->
  <circle cx="535" cy="48" r="7" fill="#ef4444"/>
  <text x="505" y="54" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#ef4444" text-anchor="end">
    REC
  </text>

  <!-- Timestamp -->
  <rect x="25" y="535" width="550" height="42" fill="#04120e" opacity="0.85" rx="4"/>
  <text x="40" y="562" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#34d399" letter-spacing="2">
    2024-10-14  01:08:14 AM  [OVERRIDE ACCEPTED]
  </text>
</svg>
