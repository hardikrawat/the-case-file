<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <!-- Aged newsprint paper background -->
  <rect width="600" height="450" fill="#e8dfce"/>

  <!-- Half-tone / Newsprint grain pattern -->
  <rect x="20" y="20" width="560" height="410" fill="#1b1712"/>

  <!-- Gallery Wall with Empty Frame -->
  <!-- Dark Damask Wallpaper -->
  <rect x="20" y="20" width="560" height="340" fill="#2d2218"/>

  <!-- Empty Gilded Frame where painting was cut out -->
  <rect x="150" y="50" width="300" height="230" fill="#150f0a" stroke="#d4af37" stroke-width="12" rx="4"/>
  <rect x="160" y="60" width="280" height="210" fill="#0d0905" stroke="#aa7c11" stroke-width="4"/>

  <!-- Cut Canvas Ribbons dangling from edges -->
  <path d="M 160,60 L 175,90 L 195,60" fill="#3a2e22"/>
  <path d="M 440,75 L 420,105 L 440,130" fill="#3a2e22"/>
  <path d="M 280,270 L 305,240 L 330,270" fill="#3a2e22"/>

  <!-- "PAINTING REMOVED" Stamp in center of empty frame -->
  <text x="300" y="170" font-family="'Georgia', serif" font-size="20" font-weight="bold" fill="#78350f" text-anchor="middle" letter-spacing="3" opacity="0.6">
    [FRAME CLEARED]
  </text>

  <!-- Gallery Floor -->
  <rect x="20" y="320" width="560" height="110" fill="#1a140e"/>

  <!-- Yellow Crime Scene Tape across the image -->
  <!-- Tape 1 -->
  <polygon points="10,240 590,380 590,415 10,275" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
  <text x="300" y="340" font-family="'Impact', 'Arial Black', sans-serif" font-size="18" fill="#000000" text-anchor="middle" transform="rotate(13.5 300 340)" letter-spacing="4">
    POLICE LINE DO NOT CROSS • FORENSIC UNIT • CRIME SCENE
  </text>

  <!-- Forensic Evidence Cone / Marker #1 -->
  <polygon points="180,390 195,350 210,390" fill="#f97316"/>
  <text x="195" y="385" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
    1
  </text>

  <!-- Forensic Evidence Cone / Marker #2 -->
  <polygon points="410,395 425,355 440,395" fill="#f97316"/>
  <text x="425" y="390" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
    2
  </text>
</svg>
